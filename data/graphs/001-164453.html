<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QBAF Graph</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e2e2e0;
    --violation: #b03a2e; --no-violation: #1f6f8b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --panel: #1f1f22; --text: #ececee; --muted: #9a9aa0; --line: #333338;
            --violation: #e06c5f; --no-violation: #5fb3d1; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .verdict { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .verdict .item b { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
  .verdict .item span { font-size: 18px; font-weight: 600; }
  .ok { color: #2e8b57; } .bad { color: #c0392b; }
  .bars { flex: 1 1 320px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .bar .label { width: 90px; font-size: 13px; }
  .bar .track { flex: 1; height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 7px; }
  .bar .num { width: 52px; font-variant-numeric: tabular-nums; font-size: 13px; text-align: left; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-left: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.en { direction: ltr; text-align: left; }
  tr.selected { background: color-mix(in srgb, var(--no-violation) 14%, transparent); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff; font-size: 12px; white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .node { cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub">גרף QBAF מהטענות האמיתיות בפסק הדין. משקל קשת = ציון השופט × θ של הקטגוריה (כרגע θ = 1).</p>

  <section class="panel verdict">
    <div class="item"><b>הכרעת המערכת</b><span id="predicted"></span></div>
    <div class="item"><b>הכרעת בית הדין</b><span id="actual"></span></div>
    <div class="item"><b>התאמה</b><span id="match"></span></div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="panel">
    <svg id="graph" role="img" aria-label="QBAF graph"></svg>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel table-wrap">
    <table>
      <thead><tr><th>#</th><th>צד</th><th>קטגוריה</th><th>ציון</th><th>טיעון</th><th>נימוק השופט</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
const DATA = {
  "caseId" : "001-164453",
  "title" : "Ziembiński v. Poland (No. 2)",
  "actualOutcome" : "violation",
  "predictedOutcome" : "violation",
  "scores" : {
    "violation" : 4.55,
    "no_violation" : 2.1
  },
  "arguments" : [ {
    "id" : "A1",
    "side" : "applicant",
    "text" : "He had not harmed other people's good name or violated their rights; he had not even put the initials of the district officials in his article.",
    "category" : "other",
    "strength" : 0.2,
    "weight" : 0.2,
    "supports" : "violation",
    "rationale" : "Concerns identifiability of the persons targeted; the domestic courts found the officials easily identifiable from the context and earlier articles, so the argument is weak."
  }, {
    "id" : "A2",
    "side" : "applicant",
    "text" : "He had respected the principle of accuracy required of journalists under the Press Act; relying on the Constitutional Court's judgment of 12 May 2008, a person accused of insult should not be held liable if he complied with standards of accuracy and reliability in gathering and verifying information, even if the allegations proved false.",
    "category" : "truth_and_verification",
    "strength" : 0.25,
    "weight" : 0.25,
    "supports" : "violation",
    "rationale" : "Invokes the accuracy and verification standards, but the conviction was for insult through value-laden epithets, not false factual allegations, so verification is largely beside the point."
  }, {
    "id" : "A3",
    "side" : "applicant",
    "text" : "He had accurately reported on the quail farm project having been appropriated by local officials, and the interference with his right to present his opinion on negative phenomena in local life was unjustified; the Press Act and the Constitution enable free and independent media to criticise the exercise of power by local government.",
    "category" : "public_interest",
    "strength" : 0.8,
    "weight" : 0.8,
    "supports" : "violation",
    "rationale" : "Criticism of a local government unemployment initiative is clearly a matter of public interest, leaving narrow margin for restriction. This is central to the Court's assessment."
  }, {
    "id" : "A4",
    "side" : "applicant",
    "text" : "He had not insulted any person, since he used no names or initials and criticised only methods and acts, without mentioning the office concerned; the words were not directed at anyone personally but at the problem of populist activity by the authorities and the supposed work of local officials.",
    "category" : "content_and_form",
    "strength" : 0.45,
    "weight" : 0.45,
    "supports" : "violation",
    "rationale" : "Argues the words targeted conduct and populism rather than persons. This is partly plausible, since the article criticises methods, but the courts found personal targeting."
  }, {
    "id" : "A5",
    "side" : "applicant",
    "text" : "Dictionaries did not list the words used as insulting expressions.",
    "category" : "content_and_form",
    "strength" : 0.2,
    "weight" : 0.2,
    "supports" : "violation",
    "rationale" : "Dictionary meaning is of limited relevance; context determines offensiveness, though the words are not among the gravest insults."
  }, {
    "id" : "A6",
    "side" : "applicant",
    "text" : "Public figures must accept the risk of being exposed to more severe criticism.",
    "category" : "status_of_person",
    "strength" : 0.7,
    "weight" : 0.7,
    "supports" : "violation",
    "rationale" : "The plaintiffs were a district mayor and officials acting in a public capacity, so wider limits of criticism apply. Civil servants' limits are somewhat narrower than politicians', but the argument is still strong."
  }, {
    "id" : "A7",
    "side" : "applicant",
    "text" : "Journalistic criticism need not be devoid of personal feelings or emotional engagement; newspapers are not government bulletins recording only facts, and emotionless publications would not be read, so a journalist cannot be forced to write without emotional engagement.",
    "category" : "content_and_form",
    "strength" : 0.7,
    "weight" : 0.7,
    "supports" : "violation",
    "rationale" : "Journalistic freedom covers a degree of exaggeration and provocation, and the domestic demand for emotion-free criticism conflicts with the Court's case-law."
  }, {
    "id" : "A8",
    "side" : "applicant",
    "text" : "The punishment was disproportionate, having led to the gradual economic downfall of the newspaper.",
    "category" : "severity_of_sanction",
    "strength" : 0.65,
    "weight" : 0.65,
    "supports" : "violation",
    "rationale" : "A criminal conviction with a substantial fine for a small local weekly carries a chilling effect. The claim of economic downfall is not substantiated in detail, but the severity is relevant."
  }, {
    "id" : "A9",
    "side" : "applicant",
    "text" : "The limits of acceptable criticism in such a case should have been determined through civil rather than criminal law.",
    "category" : "severity_of_sanction",
    "strength" : 0.6,
    "weight" : 0.6,
    "supports" : "violation",
    "rationale" : "The Court favours restraint in resorting to criminal proceedings for press expression, especially concerning criticism of public officials."
  }, {
    "id" : "G1",
    "side" : "government",
    "text" : "The interference was prescribed by law, namely Article 216 of the Criminal Code, and pursued the legitimate aim of protecting the reputation or rights of others.",
    "category" : "lawfulness_and_aim",
    "strength" : 0.6,
    "weight" : 0.6,
    "supports" : "no_violation",
    "rationale" : "The interference was undisputedly prescribed by Article 216 of the Criminal Code and pursued protection of reputation, but this does not settle necessity."
  }, {
    "id" : "G2",
    "side" : "government",
    "text" : "While there is little scope under Article 10 § 2 for restrictions on political speech or debate on matters of public interest, the domestic courts gave relevant and sufficient reasons and thoroughly justified their finding that the applicant's statements amounted to insult.",
    "category" : "other",
    "strength" : 0.3,
    "weight" : 0.3,
    "supports" : "no_violation",
    "rationale" : "The domestic courts focused on the private-conflict motive and an emotion-free standard, without properly weighing the public-interest context, so their reasons are contestable as relevant and sufficient."
  }, {
    "id" : "G3",
    "side" : "government",
    "text" : "The applicant overstepped the limits of acceptable criticism.",
    "category" : "content_and_form",
    "strength" : 0.4,
    "weight" : 0.4,
    "supports" : "no_violation",
    "rationale" : "The language was crude and offensive, which gives some weight to the claim, but in the context of a public debate on a local initiative it arguably stays within permissible exaggeration."
  }, {
    "id" : "G4",
    "side" : "government",
    "text" : "The fine of PLN 10,000 was calculated in the light of the applicant's financial situation; the courts chose not to impose restriction of liberty or imprisonment, and the penalty was the most lenient available and proportionate to his guilt and the social danger of his act.",
    "category" : "severity_of_sanction",
    "strength" : 0.35,
    "weight" : 0.35,
    "supports" : "no_violation",
    "rationale" : "A fine is the most lenient type of penalty available, but it is still a criminal conviction with a considerable sum, so the argument has only moderate force."
  }, {
    "id" : "G5",
    "side" : "government",
    "text" : "The Constitutional Court (P 10/06 and SK 43/05) stressed that while freedom of expression is important, individual dignity must also be protected and may prevail; criminal-law protection of reputation and good name is not unconstitutional in itself, since the consequences of an attack on a person's good name cannot be reversed and later apologies cannot eradicate it.",
    "category" : "other",
    "strength" : 0.3,
    "weight" : 0.3,
    "supports" : "no_violation",
    "rationale" : "Domestic constitutional case-law shows criminal defamation is not per se incompatible with the Convention, but it does not address proportionality on these facts."
  }, {
    "id" : "G6",
    "side" : "government",
    "text" : "The criminal proceedings were initiated by a private bill of indictment lodged by private individuals, not by a public prosecutor.",
    "category" : "severity_of_sanction",
    "strength" : 0.15,
    "weight" : 0.15,
    "supports" : "no_violation",
    "rationale" : "Private prosecution does not change the criminal nature of the sanction or its chilling effect, and the prosecutors acted as officials."
  } ]
};

const COLORS = {
  public_interest: "#2f7fc1", status_of_person: "#8e5bb5", prior_conduct: "#c2408a",
  truth_and_verification: "#1a9a7f", content_and_form: "#d3732a", severity_of_sanction: "#b8962e",
  lawfulness_and_aim: "#6b7785", other: "#9aa1a8"
};
const LABELS = { violation: "הפרה", no_violation: "אין הפרה" };
const css = getComputedStyle(document.documentElement);
const decisionColor = d => css.getPropertyValue(d === "violation" ? "--violation" : "--no-violation").trim();

document.getElementById("title").textContent = DATA.title + " (" + DATA.caseId + ")";
document.getElementById("predicted").textContent = LABELS[DATA.predictedOutcome] || DATA.predictedOutcome;
document.getElementById("actual").textContent = LABELS[DATA.actualOutcome];
const match = document.getElementById("match");
match.textContent = DATA.predictedOutcome === DATA.actualOutcome ? "✓ נכון" : "✗ לא נכון";
match.className = DATA.predictedOutcome === DATA.actualOutcome ? "ok" : "bad";

const maxScore = Math.max(...Object.values(DATA.scores), 0.001);
document.getElementById("bars").innerHTML = Object.entries(DATA.scores).map(([d, v]) =>
  `<div class="bar"><span class="label">${LABELS[d]}</span>
     <span class="track"><span class="fill" style="display:block;width:${(v / maxScore) * 100}%;background:${decisionColor(d)}"></span></span>
     <span class="num">${v.toFixed(2)}</span></div>`).join("");

// פריסה: טיעוני המבקש משמאל → "הפרה"; טיעוני הממשלה מימין → "אין הפרה"
const applicant = DATA.arguments.filter(a => a.side === "applicant");
const government = DATA.arguments.filter(a => a.side === "government");
const rowGap = 58, padTop = 40;
const height = padTop * 2 + Math.max(applicant.length, government.length, 2) * rowGap;
const W = 1000, colA = 90, colG = W - 90, decA = 400, decG = 600;
const svg = document.getElementById("graph");
svg.setAttribute("viewBox", `0 0 ${W} ${height}`);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent = svg) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
};
const yOf = (i, n) => padTop + (height - 2 * padTop) * (n === 1 ? 0.5 : i / (n - 1));
const decY = height / 2;

function drawSide(list, x, decX) {
  list.forEach((a, i) => {
    const y = yOf(i, list.length);
    el("line", { x1: x, y1: y, x2: decX, y2: decY, stroke: COLORS[a.category],
                 "stroke-width": 1 + a.weight * 9, "stroke-opacity": 0.55, "stroke-linecap": "round" });
    a._pos = { x, y };
  });
}
drawSide(applicant, colA, decA);
drawSide(government, colG, decG);

for (const [d, x] of [["violation", decA], ["no_violation", decG]]) {
  el("rect", { x: x - 70, y: decY - 30, width: 140, height: 60, rx: 12, fill: decisionColor(d) });
  const t = el("text", { x, y: decY + 6, "text-anchor": "middle", fill: "#fff", "font-size": 18, "font-weight": 600 });
  t.textContent = LABELS[d];
}

for (const a of DATA.arguments) {
  const g = el("g", { class: "node", "data-id": a.id });
  el("circle", { cx: a._pos.x, cy: a._pos.y, r: 20, fill: COLORS[a.category] }, g);
  const t = el("text", { x: a._pos.x, y: a._pos.y + 5, "text-anchor": "middle", fill: "#fff", "font-size": 14, "font-weight": 600 }, g);
  t.textContent = a.id;
  const tip = el("title", {}, g);
  tip.textContent = `${a.id} · ${a.category} · ${a.strength.toFixed(2)}\n${a.text}`;
  g.addEventListener("click", () => select(a.id));
}

document.getElementById("legend").innerHTML = Object.entries(COLORS)
  .map(([c, col]) => `<span><i style="background:${col}"></i>${c}</span>`).join("");

const rows = document.getElementById("rows");
rows.innerHTML = DATA.arguments.map(a =>
  `<tr id="row-${a.id}"><td><b>${a.id}</b></td><td>${a.side === "applicant" ? "המבקש" : "הממשלה"}</td>
     <td><span class="chip" style="background:${COLORS[a.category]}">${a.category}</span></td>
     <td>${a.strength.toFixed(2)}</td><td class="en"></td><td class="en"></td></tr>`).join("");
DATA.arguments.forEach(a => {
  const cells = document.querySelectorAll(`#row-${a.id} td.en`);
  cells[0].textContent = a.text;
  cells[1].textContent = a.rationale;
});

function select(id) {
  document.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
  const row = document.getElementById("row-" + id);
  row.classList.add("selected");
  row.scrollIntoView({ behavior: "smooth", block: "center" });
}
</script>
</body>
</html>
