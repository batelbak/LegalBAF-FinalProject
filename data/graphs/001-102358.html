<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QBAF Graph</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e2e2e0;
    --violation: #b03a2e; --no-violation: #1f6f8b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --panel: #1f1f22; --text: #ececee; --muted: #9a9aa0; --line: #333338;
            --violation: #e06c5f; --no-violation: #5fb3d1; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .verdict { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  .verdict .item b { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
  .verdict .item span { font-size: 18px; font-weight: 600; }
  .ok { color: #2e8b57; } .bad { color: #c0392b; }
  .bars { flex: 1 1 320px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .bar .label { width: 90px; font-size: 13px; }
  .bar .track { flex: 1; height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 7px; }
  .bar .num { width: 52px; font-variant-numeric: tabular-nums; font-size: 13px; text-align: left; }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-left: 6px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  td.en { direction: ltr; text-align: left; }
  tr.selected { background: color-mix(in srgb, var(--no-violation) 14%, transparent); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff; font-size: 12px; white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .node { cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub">גרף QBAF מהטענות האמיתיות בפסק הדין. משקל קשת = ציון השופט × θ של הקטגוריה (כרגע θ = 1).</p>

  <section class="panel verdict">
    <div class="item"><b>הכרעת המערכת</b><span id="predicted"></span></div>
    <div class="item"><b>הכרעת בית הדין</b><span id="actual"></span></div>
    <div class="item"><b>התאמה</b><span id="match"></span></div>
    <div class="bars" id="bars"></div>
  </section>

  <section class="panel">
    <svg id="graph" role="img" aria-label="QBAF graph"></svg>
    <div class="legend" id="legend"></div>
  </section>

  <section class="panel table-wrap">
    <table>
      <thead><tr><th>#</th><th>צד</th><th>קטגוריה</th><th>ציון</th><th>טיעון</th><th>נימוק השופט</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
const DATA = {
  "caseId" : "001-102358",
  "title" : "Novaya Gazeta v Voronezhe v. Russia",
  "actualOutcome" : "violation",
  "predictedOutcome" : "violation",
  "scores" : {
    "violation" : 3.95,
    "no_violation" : 2.35
  },
  "arguments" : [ {
    "id" : "A1",
    "side" : "applicant",
    "text" : "The disputed statements in the article were supported by the stadium report and the audit report issued by the Audit Department of the Ministry of Finance for the Voronezh Region.",
    "category" : "truth_and_verification",
    "strength" : 0.8,
    "weight" : 0.8,
    "supports" : "violation",
    "rationale" : "Reliance on an official audit report is a strong factual basis; the Court accepts that journalists may rely on official reports without independent verification."
  }, {
    "id" : "A2",
    "side" : "applicant",
    "text" : "It had been impossible to use the reports as evidence because the author had only ordinary copies, not originals or certified copies, and the domestic courts refused to request the originals or certified copies.",
    "category" : "truth_and_verification",
    "strength" : 0.8,
    "weight" : 0.8,
    "supports" : "violation",
    "rationale" : "The courts' refusal to obtain the originals deprived the applicant of a realistic chance to prove truth, despite its diligent efforts; this is a compelling procedural fairness point."
  }, {
    "id" : "A3",
    "side" : "applicant",
    "text" : "The domestic courts' refusal to request the originals or certified copies of the reports had a chilling effect on journalists in possession of ordinary copies of official documents capable of disclosing a matter of public interest.",
    "category" : "severity_of_sanction",
    "strength" : 0.6,
    "weight" : 0.6,
    "supports" : "violation",
    "rationale" : "This is a chilling-effect argument about deterring journalists who rely on official documents. It is relevant, though somewhat general compared with the concrete defects in the proof."
  }, {
    "id" : "A4",
    "side" : "applicant",
    "text" : "The refusal to open criminal proceedings concerning the facts described in the reports could not, in itself, render the information contained in them false.",
    "category" : "truth_and_verification",
    "strength" : 0.7,
    "weight" : 0.7,
    "supports" : "violation",
    "rationale" : "The point is correct: a refusal to prosecute does not show that the audit findings were false. The trial court relied on such refusals, so the argument carries real weight."
  }, {
    "id" : "A5",
    "side" : "applicant",
    "text" : "The requirement to prove the truth of a value judgment is not compatible with freedom of expression, yet the courts required the applicant to prove value judgments.",
    "category" : "truth_and_verification",
    "strength" : 0.75,
    "weight" : 0.75,
    "supports" : "violation",
    "rationale" : "The Court's established case-law holds that value judgments are not susceptible of proof. Several passages, such as the rhetorical questions and the 'honest mayor' irony, were evaluative, yet the domestic courts demanded proof of conjectures."
  }, {
    "id" : "A6",
    "side" : "applicant",
    "text" : "The trial court's reasoning for refusing to request certified copies of the documents had been communicated to counsel only via unofficial channels; the trial minutes contained no reference to that reasoning, which is why counsel referred to it in the appeal statement.",
    "category" : "other",
    "strength" : 0.3,
    "weight" : 0.3,
    "supports" : "violation",
    "rationale" : "This is a procedural explanation of how counsel learned of the trial court's reasoning. It is of marginal weight in itself."
  }, {
    "id" : "G1",
    "side" : "government",
    "text" : "The disputed statements were statements of fact and not value judgments.",
    "category" : "truth_and_verification",
    "strength" : 0.35,
    "weight" : 0.35,
    "supports" : "no_violation",
    "rationale" : "Some statements, such as party membership and the 20 million figure, are factual. Others are clearly value judgments or questions, so this blanket characterisation is only partly sustainable."
  }, {
    "id" : "G2",
    "side" : "government",
    "text" : "The domestic courts independently assessed the evidence before them and decided on its relevance; the trial court had sufficient evidence submitted by the parties to decide the civil dispute without using other evidence.",
    "category" : "truth_and_verification",
    "strength" : 0.25,
    "weight" : 0.25,
    "supports" : "no_violation",
    "rationale" : "Deference to domestic assessment of evidence is limited where the courts excluded the very evidence that underpinned the defence; the argument is weak on these facts."
  }, {
    "id" : "G3",
    "side" : "government",
    "text" : "The trial court's refusal to request the originals of the audit and stadium reports was well-reasoned and the applicant had been duly notified of the reasons.",
    "category" : "truth_and_verification",
    "strength" : 0.2,
    "weight" : 0.2,
    "supports" : "no_violation",
    "rationale" : "The judgment gave no reasons for the refusal, and the reasons that were reported informally (pending police proceedings) are unpersuasive. The claim is poorly supported."
  }, {
    "id" : "G4",
    "side" : "government",
    "text" : "The applicant could have complained to a court about the prosecutor's office's failure to provide the originals, but did not do so; and if the reasons were not recorded in the trial minutes, it could have requested modification of the minutes under domestic law.",
    "category" : "other",
    "strength" : 0.2,
    "weight" : 0.2,
    "supports" : "no_violation",
    "rationale" : "This is a quasi-non-exhaustion and procedural-diligence point. The applicant made extensive efforts, and the burden to secure the evidence reasonably lay with the court, so the argument has little weight."
  }, {
    "id" : "G5",
    "side" : "government",
    "text" : "The judgment was based on Article 152 of the Civil Code because the applicant failed to prove the veracity of the statements made in the article.",
    "category" : "lawfulness_and_aim",
    "strength" : 0.4,
    "weight" : 0.4,
    "supports" : "no_violation",
    "rationale" : "Article 152 provides a legal basis, so the interference was prescribed by law. However, the argument does not address proportionality or the burden of proving value judgments."
  }, {
    "id" : "G6",
    "side" : "government",
    "text" : "The interference pursued the legitimate aim of protecting the rights of others.",
    "category" : "lawfulness_and_aim",
    "strength" : 0.6,
    "weight" : 0.6,
    "supports" : "no_violation",
    "rationale" : "Protecting the reputation of others is plainly a legitimate aim and would be accepted. It carries little weight on the decisive necessity issue."
  }, {
    "id" : "G7",
    "side" : "government",
    "text" : "The interference was necessary in a democratic society because the article suggested that the plaintiffs had committed illegal acts, creating a pressing need to protect them and prevent careless use of such serious allegations.",
    "category" : "public_interest",
    "strength" : 0.35,
    "weight" : 0.35,
    "supports" : "no_violation",
    "rationale" : "Allegations of illegal acts merit protection. However, the targets were officials discussed in a matter of strong public interest, and the article was based on an official audit, so the pressing need claimed is weak."
  } ]
};

const COLORS = {
  public_interest: "#2f7fc1", status_of_person: "#8e5bb5", prior_conduct: "#c2408a",
  truth_and_verification: "#1a9a7f", content_and_form: "#d3732a", severity_of_sanction: "#b8962e",
  lawfulness_and_aim: "#6b7785", other: "#9aa1a8"
};
const LABELS = { violation: "הפרה", no_violation: "אין הפרה" };
const css = getComputedStyle(document.documentElement);
const decisionColor = d => css.getPropertyValue(d === "violation" ? "--violation" : "--no-violation").trim();

document.getElementById("title").textContent = DATA.title + " (" + DATA.caseId + ")";
document.getElementById("predicted").textContent = LABELS[DATA.predictedOutcome] || DATA.predictedOutcome;
document.getElementById("actual").textContent = LABELS[DATA.actualOutcome];
const match = document.getElementById("match");
match.textContent = DATA.predictedOutcome === DATA.actualOutcome ? "✓ נכון" : "✗ לא נכון";
match.className = DATA.predictedOutcome === DATA.actualOutcome ? "ok" : "bad";

const maxScore = Math.max(...Object.values(DATA.scores), 0.001);
document.getElementById("bars").innerHTML = Object.entries(DATA.scores).map(([d, v]) =>
  `<div class="bar"><span class="label">${LABELS[d]}</span>
     <span class="track"><span class="fill" style="display:block;width:${(v / maxScore) * 100}%;background:${decisionColor(d)}"></span></span>
     <span class="num">${v.toFixed(2)}</span></div>`).join("");

// פריסה: טיעוני המבקש משמאל → "הפרה"; טיעוני הממשלה מימין → "אין הפרה"
const applicant = DATA.arguments.filter(a => a.side === "applicant");
const government = DATA.arguments.filter(a => a.side === "government");
const rowGap = 58, padTop = 40;
const height = padTop * 2 + Math.max(applicant.length, government.length, 2) * rowGap;
const W = 1000, colA = 90, colG = W - 90, decA = 400, decG = 600;
const svg = document.getElementById("graph");
svg.setAttribute("viewBox", `0 0 ${W} ${height}`);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent = svg) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
};
const yOf = (i, n) => padTop + (height - 2 * padTop) * (n === 1 ? 0.5 : i / (n - 1));
const decY = height / 2;

function drawSide(list, x, decX) {
  list.forEach((a, i) => {
    const y = yOf(i, list.length);
    el("line", { x1: x, y1: y, x2: decX, y2: decY, stroke: COLORS[a.category],
                 "stroke-width": 1 + a.weight * 9, "stroke-opacity": 0.55, "stroke-linecap": "round" });
    a._pos = { x, y };
  });
}
drawSide(applicant, colA, decA);
drawSide(government, colG, decG);

for (const [d, x] of [["violation", decA], ["no_violation", decG]]) {
  el("rect", { x: x - 70, y: decY - 30, width: 140, height: 60, rx: 12, fill: decisionColor(d) });
  const t = el("text", { x, y: decY + 6, "text-anchor": "middle", fill: "#fff", "font-size": 18, "font-weight": 600 });
  t.textContent = LABELS[d];
}

for (const a of DATA.arguments) {
  const g = el("g", { class: "node", "data-id": a.id });
  el("circle", { cx: a._pos.x, cy: a._pos.y, r: 20, fill: COLORS[a.category] }, g);
  const t = el("text", { x: a._pos.x, y: a._pos.y + 5, "text-anchor": "middle", fill: "#fff", "font-size": 14, "font-weight": 600 }, g);
  t.textContent = a.id;
  const tip = el("title", {}, g);
  tip.textContent = `${a.id} · ${a.category} · ${a.strength.toFixed(2)}\n${a.text}`;
  g.addEventListener("click", () => select(a.id));
}

document.getElementById("legend").innerHTML = Object.entries(COLORS)
  .map(([c, col]) => `<span><i style="background:${col}"></i>${c}</span>`).join("");

const rows = document.getElementById("rows");
rows.innerHTML = DATA.arguments.map(a =>
  `<tr id="row-${a.id}"><td><b>${a.id}</b></td><td>${a.side === "applicant" ? "המבקש" : "הממשלה"}</td>
     <td><span class="chip" style="background:${COLORS[a.category]}">${a.category}</span></td>
     <td>${a.strength.toFixed(2)}</td><td class="en"></td><td class="en"></td></tr>`).join("");
DATA.arguments.forEach(a => {
  const cells = document.querySelectorAll(`#row-${a.id} td.en`);
  cells[0].textContent = a.text;
  cells[1].textContent = a.rationale;
});

function select(id) {
  document.querySelectorAll("tr.selected").forEach(r => r.classList.remove("selected"));
  const row = document.getElementById("row-" + id);
  row.classList.add("selected");
  row.scrollIntoView({ behavior: "smooth", block: "center" });
}
</script>
</body>
</html>
